name: Release Tizen WGT

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify quality gates
        run: |
          npm run lint
          npm run type-check
          npm test

      - name: Sync version and build production bundle
        run: |
          npm run version:sync
          npm run build
          npm run verify:pkg

      - name: Package .wgt (when Tizen CLI and secrets are configured)
        env:
          TIZEN_CERT_PROFILE: ${{ secrets.TIZEN_CERT_PROFILE }}
        run: |
          npm run build:wgt
          npm run verify:pkg

      - name: Upload dist and .wgt artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nettv-${{ github.ref_name }}
          path: |
            dist/
            dist-wgt/
